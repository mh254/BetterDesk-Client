name: BetterDesk embedded Support build

on:
  workflow_dispatch:
    inputs:
      generation_id:
        description: "BetterDesk generation identifier"
        required: true
        type: string
      config_b64:
        description: "Signed Support config embedded at compile time"
        required: true
        type: string
      client_commit:
        description: "Expected BetterDesk-Client commit"
        required: true
        type: string
      targets_json:
        description: "Requested targets (informational)"
        required: false
        type: string
        default: "[]"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      BETTERDESK_SUPPORT_CONFIG_B64: ${{ inputs.config_b64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.client_commit }}
      - name: Validate incoming-only payload
        run: |
          python3 -m pip install --disable-pip-version-check PyNaCl
          python3 scripts/validate_embedded_support_config.py

  build:
    needs: validate
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: support-${{ inputs.generation_id }}
      support-config-b64: ${{ inputs.config_b64 }}
      source-ref: ${{ inputs.client_commit }}
    secrets: inherit

  package:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (Lizenz)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.client_commit }}
          sparse-checkout: |
            LICENCE
            tools/rpm-lizenz.sh
          sparse-checkout-cone-mode: false

      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-windows-*
          path: raw/windows
          merge-multiple: false

      - name: Download macOS builds
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-unsigned-macos-*
          path: raw/macos
          merge-multiple: false

      - name: Download Linux x86_64 build
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-*-x86_64.deb
          path: raw/linux-x86_64
          merge-multiple: true

      - name: Download Linux aarch64 build
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-*-aarch64.deb
          path: raw/linux-aarch64
          merge-multiple: true

      - name: Download linux bundles
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-unsigned-linux-bundle-*
          path: raw/linux-bundles
          merge-multiple: true

      - name: Download Linux rpm bundles
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-*-rpms
          path: raw/rpm
          merge-multiple: true

      - name: Package embedded Support artifacts
        shell: bash
        env:
          GENERATION_ID: ${{ inputs.generation_id }}
          CLIENT_COMMIT: ${{ inputs.client_commit }}
        run: |
          set -euo pipefail
          mkdir -p out

          for arch in x86_64 aarch64; do
            base="$(find "raw/windows" -maxdepth 3 -type d -name "rustdesk-unsigned-windows-${arch}" -print -quit)"
            test -n "${base}"
            if [ -d "${base}/rustdesk" ]; then
              src="${base}/rustdesk"
            else
              src="${base}"
            fi
            test -n "$(find "${src}" -maxdepth 1 -type f -iname '*.exe' -print -quit)"
            mkdir -p "stage/windows-${arch}"
            cp -a "${src}/." "stage/windows-${arch}/"
            cp LICENCE "stage/windows-${arch}/LICENCE.txt"
            if find "stage/windows-${arch}" -iname custom.txt -o -name .custom-txt-here | grep -q .; then
              echo "External config found in Windows artifact" >&2
              exit 1
            fi
            (cd stage && zip -qr "../out/betterdesk-support-${GENERATION_ID}-windows-${arch}.zip" "windows-${arch}")
          done

          for arch in x86_64 aarch64; do
            archive="$(find "raw/macos" -type f -name "*-${arch}-app.tar.gz" -print -quit)"
            test -n "${archive}"
            mkdir -p "stage/macos-${arch}"
            tar -xzf "${archive}" -C "stage/macos-${arch}"
            cp LICENCE "stage/macos-${arch}/LICENCE"
            if find "stage/macos-${arch}" -iname custom.txt -o -name .custom-txt-here | grep -q .; then
              echo "External config found in macOS artifact" >&2
              exit 1
            fi
            tar -C stage -czf "out/betterdesk-support-${GENERATION_ID}-macos-${arch}.tar.gz" "macos-${arch}"
          done

          for arch in x86_64 aarch64; do
            deb="$(find "raw/linux-${arch}" -type f -name '*.deb' -print -quit)"
            bundle_tar="$(find raw/linux-bundles -type f -name "*${arch}*.tar.gz" -print -quit)"
            test -n "${deb}"
            test -n "${bundle_tar}" || { echo "::error::linux ${arch}: bundle fehlt" >&2; exit 1; }
            mkdir -p "stage/linux-${arch}/root" "stage/linux-${arch}/portable"
            dpkg-deb -x "${deb}" "stage/linux-${arch}/root"
            mkdir -p "stage/linux-${arch}/root/usr/share/doc/betterdesk"
            cp LICENCE "stage/linux-${arch}/root/usr/share/doc/betterdesk/LICENCE"
            tar -xzf "${bundle_tar}" -C "stage/linux-${arch}/portable" --strip-components=1 --no-same-owner
            test -x "stage/linux-${arch}/portable/betterdesk" || { echo "::error::linux ${arch}: betterdesk fehlt" >&2; exit 1; }
            test -n "$(ls -A "stage/linux-${arch}/portable/lib")" || { echo "::error::linux ${arch}: lib leer" >&2; exit 1; }
            # files/ (polkit, systemd) liegt nur im deb
            cp -a "stage/linux-${arch}/root/usr/share/rustdesk/files" "stage/linux-${arch}/portable/files"
            cp LICENCE "stage/linux-${arch}/portable/LICENCE"
            if find "stage/linux-${arch}" -iname custom.txt -o -name .custom-txt-here | grep -q .; then
              echo "External config found in Linux artifact" >&2
              exit 1
            fi
            tar -C stage --owner=0 --group=0 --numeric-owner \
              -czf "out/betterdesk-support-${GENERATION_ID}-linux-${arch}.tar.gz" "linux-${arch}"
          done

          # deb/rpm/arch als eigene Assets — die Konsole adressiert jedes Ziel einzeln
          for arch in x86_64 aarch64; do
            deb="$(find "raw/linux-${arch}" -type f -name '*.deb' -print -quit)"
            test -n "${deb}"
            cp -f "${deb}" "out/betterdesk-support-${GENERATION_ID}-linux-${arch}.deb"
            # LICENCE ins deb: dpkg-deb -R/-b erhaelt Control-Daten und Metadaten
            W="$(mktemp -d)"
            dpkg-deb -R "out/betterdesk-support-${GENERATION_ID}-linux-${arch}.deb" "${W}/root"
            mkdir -p "${W}/root/usr/share/doc/betterdesk"
            cp LICENCE "${W}/root/usr/share/doc/betterdesk/LICENCE"
            cp LICENCE "${W}/root/usr/share/doc/betterdesk/copyright"
            ( cd "${W}/root" && find . -type f ! -path './DEBIAN/*' -printf '%P\n' \
              | while read -r f; do printf '%s  %s\n' "$(md5sum "$f" | cut -d' ' -f1)" "$f"; done > DEBIAN/md5sums )
            dpkg-deb -b "${W}/root" "out/betterdesk-support-${GENERATION_ID}-linux-${arch}.deb"
            rm -rf "${W}"
            rpm="$(find raw/rpm -maxdepth 1 -type f -name "*.${arch}.rpm" ! -name '*-suse.rpm' -print -quit)"
            test -n "${rpm}"
            cp -f "${rpm}" "out/betterdesk-support-${GENERATION_ID}-linux-${arch}.rpm"
            # RPM laesst sich nicht wie deb neu schnuern: rpm2cpio + rpmbuild mit
            # uebernommener Dateiliste haelt Requires und Scriptlets.
            # Jede Zeile hier ist absichtlich laut — ein stummer Block hat am 20.10.
            # zwei Laeufe gekostet, in denen niemand sagen konnte, ob er lief.
            if ! command -v rpmbuild >/dev/null 2>&1; then
              echo "RPM ${arch}: rpmbuild fehlt, installiere rpm + cpio"
              sudo apt-get update -qq || true
              sudo apt-get install -y rpm cpio || true
            fi
            echo "RPM ${arch}: rpmbuild=$(command -v rpmbuild || echo FEHLT) rpm2cpio=$(command -v rpm2cpio || echo FEHLT) cpio=$(command -v cpio || echo FEHLT)"
            if command -v rpmbuild >/dev/null 2>&1 && command -v rpm2cpio >/dev/null 2>&1 \
               && command -v cpio >/dev/null 2>&1; then
              bash tools/rpm-lizenz.sh "out/betterdesk-support-${GENERATION_ID}-linux-${arch}.rpm" \
                ./LICENCE "/usr/share/doc/betterdesk/LICENCE" \
                || echo "FEHLER: rpm-lizenz.sh Exit $? — RPM bleibt ohne LICENCE"
            else
              echo "WARNUNG: rpmbuild fehlt, RPM ohne LICENCE" >&2
            fi
            root="stage/arch-${arch}"
            rm -rf "${root}"
            mkdir -p "${root}"
            dpkg-deb -x "${deb}" "${root}"
            mkdir -p "${root}/usr/share/doc/betterdesk"
            cp LICENCE "${root}/usr/share/doc/betterdesk/LICENCE"
            printf '%s\n' \
              'pkgname = betterdesk-support' \
              'pkgbase = betterdesk-support' \
              'pkgver = 0.0.0-1' \
              'pkgdesc = BetterDesk Support client' \
              'url = https://betterdesk.eu' \
              'builddate = 1791158400' \
              'packager = BetterDesk' \
              "arch = ${arch}" \
              > "${root}/.PKGINFO"
            tar --zstd -C "${root}" -cf "out/betterdesk-support-${GENERATION_ID}-linux-${arch}.pkg.tar.zst" .
          done

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("out")
          ENDUNGEN = (
              (".pkg.tar.zst", "arch"),
              (".tar.gz", "portable"),
              (".deb", "deb"),
              (".rpm", "rpm"),
              (".zip", "portable"),
          )
          def _target(name):
              for platform in ("windows", "macos", "linux"):
                  if f"-{platform}-" in name:
                      for arch in ("x86_64", "aarch64"):
                          for endung, format_ in ENDUNGEN:
                              if name.endswith(f"-{arch}{endung}"):
                                  return platform, arch, format_
              raise SystemExit(f"unerkannter Artefaktname: {name}")

          assets = []
          for item in sorted(root.iterdir()):
              if item.is_file() and item.name != "manifest.json":
                  platform, arch, format_ = _target(item.name)
                  assets.append({
                      "name": item.name,
                      "platform": platform,
                      "arch": arch,
                      "format": format_,
                      "sha256": hashlib.sha256(item.read_bytes()).hexdigest(),
                      "size": item.stat().st_size,
                  })
          manifest = {
              "schema_version": 1,
              "sku": "betterdesk-support",
              "generation_id": os.environ["GENERATION_ID"],
              "client_commit": os.environ["CLIENT_COMMIT"],
              "assets": assets,
              "external_config": False,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          ! find out -iname custom.txt -o -name .custom-txt-here | grep -q .

      - name: Upload embedded Support artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betterdesk-support-${{ inputs.generation_id }}
          path: out
